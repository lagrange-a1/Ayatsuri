# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated code is produced by build_runner / flutter_rust_bridge and is
  # not authored here; strict flags are enforced on hand-written code only.
  exclude:
    - "lib/**/*.freezed.dart"
    - "lib/**/*.g.dart"
    - "lib/scheduler/frb_generated.dart"
    - "lib/scheduler/frb_generated.io.dart"
    - "lib/scheduler/frb_generated.web.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  # Stronger checks than the Flutter default. These are the Dart equivalent of
  # tightening a type system: implicit casts, raw generics, untyped closures
  # and leaked resources become build-time failures instead of runtime traps.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_locals
    - test_types_in_equals
    - throw_in_finally
